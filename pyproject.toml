[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-env-inspector"
version = "0.1.0"
description = "Zero-dependency environment variable schema auditor and validator against .env.example templates"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "me1121118" }
]
keywords = ["fastapi", "python", "utility", "tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/me1121118/py-env-inspector"
Repository = "https://github.com/me1121118/py-env-inspector"
